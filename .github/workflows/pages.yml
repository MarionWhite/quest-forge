name: Publish site

# The homepage (site/home) is the site root and the directory of everything else; its
# 404.html, favicon and img/ land at the root with it. Every other page is served under
# its own folder name: /play/, /mods/, /items/, /worlds/, /enchantments/, /ore-atlas/,
# /online/, /shaders/, /decisions/, /first-night/, /lucky/, /graves/, /players/.
# /online/ reads a status feed the server publishes elsewhere (a Gist), so a status update never deploys the site.
#
# All of them are committed as generated output (see site/README.md); this workflow
# only arranges them, it does not build them. To change what they contain,
# regenerate with tools/modlist/ or tools/items/ and commit the result.
#
# Two files are generated here, not committed, and are soft: a failure to write them
# never fails the deploy.
#   _site/play/pack.json              tools/site/pack_json.py: the pack's fingerprint, packDate
#                                     and commit, for the play page
#   _site/items/data/freshness.json   tools/site/check_fresh.py: which generated data (item
#                                     index, mod list, enchantment roster) lags the pack, and
#                                     why. The item index page shows a banner from it.
# The checkout is full-history (fetch-depth: 0) because check_fresh.py reads git history.
#
# The triggers are the inputs to those checks: a change to any of them can make the
# generated data stale, or change the pack's fingerprint. The site-fresh.yml workflow
# fails a push when the committed data is already stale; this one only publishes it.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'pack/mods.tsv'
      - 'pack/scripts/**'
      - 'pack/config/**'
      - 'mods/qf-content/src/main/java/**/Item*.java'
      - 'mods/qf-content/src/main/java/**/Block*.java'
      - 'mods/qf-content/src/main/java/**/Mod*.java'
      - 'mods/qf-content/src/main/java/**/ench/**'
      - 'mods/qf-content/src/main/resources/assets/**'
      - 'mods/qf-commands/src/main/java/**/Item*.java'
      - 'mods/qf-commands/src/main/java/**/Unlockables.java'
      - 'mods/qf-commands/src/main/resources/assets/**'
      - 'tools/site/**'
      - 'tools/pack_fingerprint.py'
      - 'tools/modlist/catalog.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_fresh.py reads the git history

      - name: Assemble the publish directory
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/home/. _site/
          cp -R site/play _site/play
          cp -R site/mods _site/mods
          cp -R site/items _site/items
          cp -R site/worlds _site/worlds
          cp -R site/enchantments _site/enchantments
          cp -R site/ore-atlas _site/ore-atlas
          cp -R site/online _site/online
          cp -R site/shaders _site/shaders
          cp -R site/decisions _site/decisions
          cp -R site/first-night _site/first-night
          cp -R site/lucky _site/lucky
          cp -R site/graves _site/graves
          cp -R site/players _site/players
          cp -R site/lib _site/lib
          test -s _site/index.html
          test -s _site/lib/three/three.module.min.js
          test -s _site/404.html
          test -s _site/first-night/index.html
          test -s _site/lucky/index.html
          test -s _site/graves/index.html
          test -s _site/players/index.html

      - name: Write the pack description (soft)
        run: |
          python3 -I tools/site/pack_json.py --out _site/play/pack.json \
            || echo "::warning::could not write _site/play/pack.json"

      - name: Write the freshness report (soft)
        run: |
          python3 -I tools/site/check_fresh.py --json --out _site/items/data/freshness.json \
            || echo "::warning::could not write _site/items/data/freshness.json"

      - name: List what is published
        run: |
          echo "Publishing:"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
