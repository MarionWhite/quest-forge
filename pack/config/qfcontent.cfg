##########################################################################################################
# packcheck
#--------------------------------------------------------------------------------------------------------#
# The login pack check. A client whose ID-bearing configs (see /qfpack) or shared mod
# versions differ from the server's is disconnected with a message saying which side
# is out of date. Only a dedicated server checks; these settings matter there, except
# packDate, which every side shows on its main menu and F3 screen.
##########################################################################################################

packcheck {
    # Server: further client fingerprints to let in, e.g. last release's while friends update. [default: ]
    S:alsoAccept <
     >

    # Server: disconnect a client that has not answered the check after this long. [range: 5 ~ 600, default: 60]
    I:answerTimeoutSeconds=60

    # Server: also refuse a client whose version of a mod both sides have differs. [default: true]
    B:checkModVersions=true

    # Check every joining client. Turn off only in an emergency; prefer alsoAccept. [default: true]
    B:enabled=true

    # Server, emergency only: require this fingerprint from clients instead of the one
    # computed from this server's own configs. Empty = computed. [default: ]
    S:expectedFingerprint=

    # Server: mod IDs whose versions may differ between client and server. [default: ]
    S:ignoreMods <
     >

    # The pack release this config folder belongs to (YYYY-MM-DD). It is not part of the
    # fingerprint; it says which side is older when fingerprints differ. Bump it with
    # `py -3.10 tools/pack_fingerprint.py --stamp` whenever an ID-bearing config changes. [default: ]
    S:packDate=2026-10-17

    # Where a refused player gets the current pack. Shown in the refusal message. [default: https://github.com/MarionWhite/quest-forge/releases]
    S:updateFrom=https://github.com/MarionWhite/quest-forge/releases
}


