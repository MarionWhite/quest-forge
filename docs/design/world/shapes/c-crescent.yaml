# Shape C, "Crescent" (after Kamchatka): a thick arc whose outer curve faces west and whose
# two horns point east around an inner sea. The thick north horn is tundra with the glacial
# caldera; the outer west curve is the redwood coast behind a coastal range; the old centre
# sits off-centre on the inner side of the arc, joined to the inner sea by a flooded canyon
# cut; the south end splits into a Baja-style desert arm and a south horn around a long gulf.
# Render: py -3.10 tools/world/plan.py render docs/design/world/shapes/c-crescent.yaml PLANDIR --px 64
