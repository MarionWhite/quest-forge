# Shape B, "Spine" (Italy and New Zealand's South Island). Render: py -3.10 tools/world/plan.py render docs/design/world/shapes/b-spine.yaml PLANDIR [--px 64]
# One diagonal landmass, NW to SE, with a single mountain spine. Wet west: redwoods on the coast,
# rainforest and maple up the slope. Dry east: rain shadow, steppe, outback, then the desert
# plateau and its canyon. The north splays into a tundra plateau with the glacial caldera, and
# the south forks into two prongs around a long gulf. The old centre sits mid-spine.
