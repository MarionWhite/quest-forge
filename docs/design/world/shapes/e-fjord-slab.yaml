# Shape E, "Fjord Slab" (Scandinavia and Iceland). docs/design/world/research/continent-shapes.md 3E.
# A top-heavy block: fjords shred the north and west coasts, and a coastal range (the
# Scandes) runs down the west. BoP Redwood Forest fills the sheltered southwest coast; the
# interior behind the range is a dry plateau cut by the canyon; the east coast is smooth and
# low. The body tapers south-east to one point, split by a long gulf (Baja style).
