# Shape A, "Hook" (Baja-led): a broad northern shoulder of tundra that sweeps into one long
# southern arm, with a rift gulf between the arm and the shorter eastern mainland.
# Geology first: a western coastal range runs the whole west coast and down the arm (redwoods
# on its windward side, desert and canyon in its rain shadow); a northern range walls off the
# tundra. The old crater sits where the shoulder narrows above the gulf's head.
# Render: py -3.10 tools/world/plan.py render docs/design/world/shapes/a-hook.yaml PLANDIR [--px 64]
