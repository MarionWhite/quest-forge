# Shape D: Two Lobes (Kalimdor-like). docs/design/world/research/continent-shapes.md section 3D.
# A big, wide north lobe (tundra, glacial caldera, taiga) joined through a volcanic isthmus,
# which holds the old crater centre, to a smaller south lobe of desert and canyon. The south
# lobe splits into two prongs around a long gulf (Baja). A western cordillera runs the whole
# length; BoP Redwood Forest lines its seaward side.
# Render: py -3.10 tools/world/plan.py render docs/design/world/shapes/d-two-lobes.yaml PLANDIR --px 64
