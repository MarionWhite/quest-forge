# Combined base map (author review of the refs round, 2026-10-19).
# refs-1's layout (compact main continent, climate bands, volcano centre with its T3/T4 rings,
# the southern savanna-and-desert land with the canyon), with the author's fixes:
#   - the glacial caldera moved to the north-east, far from the volcano;
#   - the north spread across the full width as its own landmass (tundra and snowy forest in
#     the north-west, caldera, Alps and boreal forest in the north-east, the Ice castle in the
#     tundra south of that range, ice islets along the north coast);
#   - refs-3's west redwood coast (broad northern headland, deep sheltered inlet with the T1
#     spawn, long strip behind kelp shallows, coastal range behind);
#   - an east coast that changes along its length (frayed steppe shore with an inlet and lakes,
#     reef-fringed rainforest headlands with a detached islet, a mangrove cove at the south end).
# The Maelstrom is NOT in this file: make_variants.py adds it as one block at four positions
# (maelstrom-a..d.yaml). Keep at least 3,000 blocks of sea between land and the canvas edge.
# Render: py -3.10 tools/world/plan.py render docs/design/world/combined/base.yaml PLANDIR --px 64
