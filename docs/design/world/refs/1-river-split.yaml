     [20000, -14500], [16000, -17500], [10000, -19000], [4000, -20500], [-2000, -20500]]
  # A wooded island off the south-west
  - [[-21500, 7500], [-17500, 7800], [-16800, 12000], [-19500, 14000], [-23000, 11500]]
rough_zones:
  - {polygon: [[-17000, -16500], [4000, -16500], [4000, -9000], [-17000, -9000]], mul: 2.5}
