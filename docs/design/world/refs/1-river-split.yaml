# Refs round, design 1: after the author's reference image 1.
# A main continent almost cut in two by one great river through the tropics, a separate
# northern tundra landmass bridged by an island chain to the main continent's fjorded north,
# a broad middle, and a long south-west tail.
# Render: py -3.10 tools/world/plan.py render docs/design/world/refs/1-river-split.yaml PLANDIR [--px 64]
# Blocks, 0,0 at the centre, +x east, +z south. Biome IDs: docs/survey/biome-ids.tsv.
size: 49152
seed: 101
region_warp: 2400
blend_px: 18
shore_width: 1000
shelf_width: 1600

coast_rough: {amp: 2200, scale: 8000, octaves: 8}
