     [-18000, 23800], [-19000, 21800], [-14000, 19500], [-10000, 17000], [-8500, 14000], [-8500, 11000], [-10500, 8500],
     [-15000, 7000], [-17500, 4000], [-17500, -1000], [-16500, -6000], [-14000, -9500], [-12000, -12000]]
  # The northern tundra landmass, running off the north-east like the reference
