# Refs design 3: the Maelstrom Sea (inspired by the author's reference image 3).
# A continent wrapped around a vast dark inner sea that opens to the ocean in the north. At
# the inner sea's heart is the maelstrom: an abyss (basin to y 5) ringed by BoP Crag sea stacks.
# Snowy mountains in the north-east, a desert band across the south, forest in the south-east,
# a ragged western mass with the redwood coast on its outer shore.
# Render: py -3.10 tools/world/plan.py render docs/design/world/refs/3-maelstrom.yaml PLANDIR --px 64
