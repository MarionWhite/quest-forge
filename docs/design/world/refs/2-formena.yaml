# Refs round, design 2: inspired by the author's "Formena" reference (asymmetry, a deep bay
# biting in from the north-east, a mountain-spined east lobe, a snowy north, a desert south-west
# behind its range, island groups in the corners), plus the keepers: redwood coast, the old
# crater-lake centre, the glacial caldera, a canyon, tundra with a frost-forest ice castle,
# and a gulf off a southern point.
# Render: py -3.10 tools/world/plan.py render docs/design/world/refs/2-formena.yaml PLANDIR --px 64
