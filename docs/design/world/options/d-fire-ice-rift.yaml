# World option D: fire and ice, split by the rift.
# Render: py -3.10 tools/world/plan.py render docs/design/world/options/d-fire-ice-rift.yaml PLANDIR
# Blocks, 0,0 at the centre, +x east, +z south. The continent runs long from the NW to the SE.
# A rift crosses it SW-NE through the centre. NW of the rift it grows colder towards a
# glacier ice-sheet (T4). SE of it it grows hotter towards a volcano field (T4). The temperate
# lands on both rims are raised rift shoulders (T1), and the rift floor is T3.
# Biome IDs: docs/survey/biome-ids.tsv.
