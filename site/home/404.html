<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Quest Forge</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this file for any missing path, at any depth, so every link here is
     absolute to the project site rather than relative. -->
<link rel="icon" href="/quest-forge/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root{--paper:#E9EAE4;--ink:#171B19;--ink-2:#3E4642;--muted:#6A726C;--rule:#CDD1C8;--ember:#A33F17;--ember-ink:#8E3712}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111412;--ink:#E7E9E2;--ink-2:#C2C7BE;--muted:#8B948B;--rule:#282E29;--ember:#E58A55;--ember-ink:#EFA274}}
:root[data-theme="dark"]{--paper:#111412;--ink:#E7E9E2;--ink-2:#C2C7BE;--muted:#8B948B;--rule:#282E29;--ember:#E58A55;--ember-ink:#EFA274}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;align-items:center}
.wrap{max-width:720px;margin:0 auto;padding:48px 28px}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember-ink);margin:0 0 14px}
h1{font-family:Archivo,sans-serif;font-size:clamp(38px,8vw,72px);font-weight:800;letter-spacing:-.03em;line-height:.95;margin:0}
p{color:var(--ink-2);max-width:52ch;margin:20px 0 0;font-size:17px}
nav{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:30px;font-family:Archivo,sans-serif;font-size:15px;font-weight:600}
nav a{color:var(--ember-ink);text-decoration:none;border-bottom:2px solid var(--rule)}
nav a:hover{border-color:var(--ember)}
footer{padding:20px 28px 40px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main><div class="wrap">
  <p class="kicker">Quest Forge &middot; 404</p>
  <h1>Nothing generates here.</h1>
  <p>There is no page at this address. It may have moved when the site was reorganised, or the link was wrong
    to begin with.</p>
  <nav aria-label="Site">
    <a href="/quest-forge/">Home</a>
    <a href="/quest-forge/play/">Get the pack</a>
    <a href="/quest-forge/mods/">Mod list</a>
    <a href="/quest-forge/items/">Item index</a>
    <a href="/quest-forge/worlds/">Worlds</a>
    <a href="/quest-forge/enchantments/">Enchantments</a>
  </nav>
</div></main>
<footer>Minecraft 1.7.10 &middot; Not affiliated with Mojang or any mod author</footer>
</body>
</html>
