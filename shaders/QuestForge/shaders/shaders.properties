# Quest Forge shader pack: Angelica (Iris 1.7.10 backport) only.
# Design: docs/design/shaders/README.md; budgets: performance-rules.md; milestone notes:
# milestone-1.md. This file is preprocessed, so it can switch on the pack's options.

# --- vanilla parts the pack replaces --------------------------------------------------
# The sky, sun, moon and stars are drawn in deferred.fsh; clouds come in a later milestone.
sun = false
moon = false
clouds = off
underwaterOverlay = false
vignette = false
# Vertex AO in the colour's alpha instead of multiplied into the tint, so the pack sets
# its strength (Low: vanilla AO at 0.6).
separateAo = true

# --- buffers -----------------------------------------------------------------------------
# colortex5: the sky lookup tables and per-frame constants (lib/lut.glsl), not full screen.
size.buffer.colortex5 = 256 320

# --- the shadow pass is switched explicitly (rule 3) --------------------------------------
#if QF_PRESET == 0
shadow.enabled = false
program.composite1.enabled = false
#else
shadow.enabled = true
#endif
shadowTranslucent = false
shadowPlayer = true
#if QF_PRESET <= 1
shadowEntities = false
shadowBlockEntities = false
#elif QF_PRESET == 2
shadowEntities = true
shadowBlockEntities = false
#else
shadowEntities = true
shadowBlockEntities = true
#endif

# --- blending: a G-buffer cannot blend (docs/design/shaders/README.md, trap 3) -------------
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_basic = off
blend.gbuffers_textured = off
blend.gbuffers_textured_lit = off
blend.gbuffers_beaconbeam = off
blend.gbuffers_spidereyes = off
# Translucent and forward programs blend their colour into colortex3; their surface data
# (normal, material, light) replaces what is below.
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1 = off
blend.gbuffers_water.colortex2 = off
blend.gbuffers_hand = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex1 = off
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# --- fog by biome and weather (program/composite.glsl) ------------------------------------
# Iris biome_category: 2 EXTREME_HILLS, 5 PLAINS, 14 SWAMP, 17 MOUNTAIN; biome_precipitation 2 = snow.
# Smoothed over a few seconds so crossing a biome border is a fade, not a cut.
# On by default since r001, only where the owner's answers clearly justify it (r000: crisp
# mountains, a heavy vision-limiting tundra storm); the swamp gets a subtle hint of the moody
# fog. Everything else, plains included, keeps the baseline haze (QF_HAZE) until each biome is
# dialled in from real views in it (owner, r001).
#if QF_BIOME_FOG == 1
uniform.float.qfFogCrisp = smooth(if(biome_category == 2 || biome_category == 17, 1.0, 0.0), 6, 6)
uniform.float.qfFogMoody = smooth(if(biome_category == 14, 0.35, 0.0), 6, 6)
uniform.float.qfFogStorm = smooth(if(biome_precipitation == 2, rainStrength, 0.0), 4, 4)
#endif

# --- profiles: each sets only QF_PRESET (performance-rules.md) ----------------------------
profile.POTATO = QF_PRESET=0
profile.LOW = QF_PRESET=1
profile.MEDIUM = QF_PRESET=2
profile.HIGH = QF_PRESET=3
profile.ULTRA = QF_PRESET=4

screen = <profile> <empty> QF_PRESET <empty> QF_NIGHT_FLOOR QF_EXPOSURE_BIAS QF_WAVING <empty> QF_DEBUG_VIEW
sliders = QF_NIGHT_FLOOR QF_EXPOSURE_BIAS
