# Gradle settings
org.gradle.caching = true
# RFG 2.0.3's extractDependencyATs task cannot be serialised into the
# configuration cache (it captures a live FileCollection in an onlyIf spec).
# The QuestForge-Mods project gets away with it; this one does not, because it
# actually has dependencies to scan for access transformers.
org.gradle.configuration-cache = false
org.gradle.welcome = never

# Decompiling Minecraft is memory-hungry; the default heap is not enough.
org.gradle.jvmargs = -Xmx4G -XX:MaxMetaspaceSize=1G

# RetroFuturaGradle 2.0.3 is compiled for Java 25, so Gradle itself must run on
# a JDK 25. This is only the build JVM -- the mod still compiles to Java 8
# bytecode via the toolchain in build.gradle.kts, and the game still runs on
# Java 8. Keg-only Homebrew install, so the system default `java` stays 17.
org.gradle.java.home = /opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home

# This machine has SIX Java 8 installs, and three of them are Oracle 8. Auto-detection
# would make "Java 8 from Oracle" ambiguous between 8u162 (works) and 8u291/8u301
# (crash LWJGL). So auto-detection is off and exactly two toolchains are declared:
#   Zulu 8u442 (arm64)  -> compiling, selected by vendor AZUL
#   Oracle 8u162 (x64)  -> running the game, selected by vendor ORACLE
org.gradle.java.installations.auto-detect = false
org.gradle.java.installations.paths = /Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home,/Library/Java/JavaVirtualMachines/jdk1.8.0_162.jdk/Contents/Home
