# Quest Forge LITE on the Angelica client: keys apply-lite.ps1 sets in
# config/angelica-modules.cfg (Angelica reads it at start-up).
general {
    # Dynamic lights off, as ofDynamicLights:3 on OptiFine: every moving light
    # (held torches, blazes, fiery Lycanites) forces chunk re-renders around it.
    B:enableDynamicLights=false
}
