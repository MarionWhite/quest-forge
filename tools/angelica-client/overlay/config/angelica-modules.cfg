# Quest Forge overrides for Angelica's config/angelica-modules.cfg.
# build_angelica_client.py merges these keys into the file Angelica writes on
# first boot (or creates the file with only these; Forge fills in the rest).

general {
    # The Quest Forge loading screen has its own bars; Angelica's memory bar
    # would be drawn over the mural. [default: true]
    B:showSplashMemoryBar=false
}
